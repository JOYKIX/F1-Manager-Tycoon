<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Manager Tycoon</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>F1 Manager Tycoon</h1>
        <div class="status" id="save-status" aria-live="polite"></div>
      </header>

      <section class="panel setup" id="setup-panel">
        <form id="setup-form" class="setup-grid">
          <label>
            Année de départ
            <select id="season-select" name="season"></select>
          </label>

          <label>
            Écurie
            <select id="team-select" name="team" disabled></select>
          </label>

          <label>
            Prénom
            <input id="first-name" name="firstName" autocomplete="given-name" required />
          </label>

          <label>
            Nom
            <input id="last-name" name="lastName" autocomplete="family-name" required />
          </label>

          <label>
            Date de naissance
            <input id="birth-date" name="birthDate" type="date" required />
          </label>

          <button type="submit">Commencer</button>
        </form>
      </section>

      <section class="game hidden" id="game-panel">
        <aside class="panel manager-card">
          <h2 id="manager-name"></h2>
          <dl>
            <div><dt>Âge</dt><dd id="manager-age"></dd></div>
            <div><dt>Espérance de vie</dt><dd id="manager-life"></dd></div>
            <div><dt>Saison</dt><dd id="current-season"></dd></div>
            <div><dt>Écurie</dt><dd id="current-team"></dd></div>
            <div><dt>Budget</dt><dd id="budget"></dd></div>
          </dl>
          <nav class="page-nav" id="page-nav" aria-label="Navigation"></nav>
        </aside>

        <section class="workspace" id="workspace"></section>
      </section>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
